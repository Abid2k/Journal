<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Just Enjoy Writing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2a2623">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --green:#16382f; --gold:#c9a24b; --paper:#e9d8a6; --ink:#1d1b18; }
  * { box-sizing: border-box }
  [hidden] { display:none !important }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#2a2623; color:#d8cfbd;
         font-family:'Special Elite','Courier New',monospace; }
  button, input { font:inherit }
  .grid-bg { background:
             linear-gradient(90deg,#0003 1px,transparent 1px) 0 0/10px 10px,
             linear-gradient(#0003 1px,transparent 1px) 0 0/10px 10px, var(--green) }

  /* shelf */
  .shelf { width:min(760px,92vw); padding:24px 0; text-align:center }
  .shelf h1 { font-weight:400; font-size:22px; letter-spacing:2px; margin:0 0 34px }
  .grid { display:flex; flex-wrap:wrap; gap:34px 28px; justify-content:center }
  .mini { position:relative; width:132px; height:186px; border:0; border-radius:5px; color:var(--gold); cursor:pointer;
          padding:0 10px 12px; display:flex; align-items:flex-end; justify-content:flex-start; text-align:left; font-size:14px;
          box-shadow:0 10px 20px #0008; transition:transform .2s }
  .mini:hover { transform:translateY(-8px) rotate(-1.5deg) }
  .mini::before { content:""; position:absolute; top:-9px; left:8px; right:8px; height:18px; border-radius:6px;
                  background:repeating-linear-gradient(90deg,var(--gold) 0 5px,transparent 5px 14px) }
  .mini span { border:1px solid var(--gold); width:100%; padding:6px 7px; overflow-wrap:anywhere }
  .mini .del { position:absolute; top:8px; right:8px; width:22px; height:22px; border-radius:50%; background:#0006; color:var(--gold);
               font-size:11px; display:grid; place-items:center; opacity:.55; width:22px; padding:0; border:0 }
  .mini .del:hover { opacity:1; background:#b3261e; color:#fff }
  .mini.add { background:none; border:2px dashed #6d6558; color:#a39a8a; align-items:center; justify-content:center; box-shadow:none }
  .mini.add::before { display:none }
  form { margin-top:40px; display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap }
  form input[type=text] { background:#1d1a17; border:1px solid #6d6558; color:inherit; padding:8px 10px; border-radius:4px; width:190px }
  .sw { display:flex; gap:8px }
  .sw input { appearance:none; width:24px; height:24px; border-radius:50%; background:var(--c); border:2px solid #0000; cursor:pointer; margin:0 }
  .sw input:checked { border-color:var(--gold) }
  form button { background:var(--gold); border:0; color:#241f12; padding:8px 14px; border-radius:4px; cursor:pointer }

  /* book */
  .book { position:relative; width:min(380px,92vw); height:min(580px,88vh); perspective:1600px; }
  .rings { position:absolute; top:-14px; left:6%; right:6%; display:flex; justify-content:space-between; z-index:5; pointer-events:none }
  .rings i { width:14px; height:34px; border:4px solid var(--gold); border-radius:8px;
             box-shadow:1px 2px 3px #0008; background:linear-gradient(90deg,#0004,transparent 50%,#0004) }

  .page { position:absolute; inset:0; background:var(--paper); border-radius:6px; padding:34px 0 0;
          display:flex; flex-direction:column; box-shadow:0 20px 40px #000a; color:var(--ink) }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:0 22px; height:34px; font-size:13px; color:#5a4c2a }
  .bar button { background:none; border:0; color:inherit; cursor:pointer; padding:4px 6px }
  .bar button:hover { color:var(--ink) }
  .sheet { position:absolute; inset:0; z-index:3; transform-origin:top; transform-style:preserve-3d; pointer-events:none;
           transition:transform .9s cubic-bezier(.5,0,.3,1) }
  .sheet .face { background:var(--paper); overflow:hidden; padding-top:34px; box-shadow:0 6px 18px #0006; color:var(--ink) }
  .sheet .back { background:#dcc98f }
  .txt { position:absolute; top:68px; bottom:0; left:0; right:0; white-space:pre-wrap; overflow:hidden }
  .open .cover { z-index:1 }
  textarea, .txt { flex:1; width:100%; border:0; outline:0; resize:none; padding:0 22px; background-color:transparent;
             font:inherit; font-size:17px; line-height:32px; color:var(--ink); letter-spacing:.3px;
             background-image:repeating-linear-gradient(transparent 0 31px,#9a875a55 31px 32px);
             background-attachment:local; caret-color:#b3261e; text-shadow:0 0 1px #1d1b1866 }

  .cover { position:absolute; inset:0; transform-origin:top; transform-style:preserve-3d; transition:transform 1.1s cubic-bezier(.6,0,.2,1);
           cursor:pointer; z-index:4 }
  .face { position:absolute; inset:0; border-radius:6px; backface-visibility:hidden }
  .front { color:var(--gold); box-shadow:0 20px 40px #000a }
  .back { background:var(--green); transform:rotateX(180deg) }
  .title { position:absolute; right:8%; bottom:11%; width:52%; font-size:20px; letter-spacing:1px }
  .title b { display:block; font-weight:400; font-size:21px }
  .title .box { margin:14px 0 12px; border:1px solid var(--gold); height:96px; padding:8px 10px; font-size:17px; overflow:hidden; overflow-wrap:anywhere;
                background:linear-gradient(var(--gold) 1px,transparent 1px) 0 40px/100% 32px }
  .title .box { padding:0; background:none; display:grid; grid-template-rows:repeat(3,1fr) }
  .f { min-width:0; background:none; border:0; border-bottom:1px solid var(--gold); outline:0; color:var(--gold); caret-color:var(--gold);
       font:inherit; font-size:15px; padding:0 8px }
  .f:last-child { border-bottom:0 }
  .f::placeholder { color:var(--gold); opacity:.45 }
  .title small { letter-spacing:4px; font-size:11px; line-height:1.6; display:block }
  .open .cover { transform:rotateX(180deg); pointer-events:none }
  .hint { position:absolute; bottom:-40px; width:100%; text-align:center; color:#a39a8a; font-size:13px; transition:opacity .4s; pointer-events:none }
  .hint button { background:none; border:0; color:var(--gold); cursor:pointer; pointer-events:auto; margin-left:8px }
  .open .hint { opacity:0 }
  .open .hint button { pointer-events:none }
</style>

<div class="shelf" id="shelf">
  <h1>Choose your notebook</h1>
  <div class="grid" id="grid"></div>
  <form id="make">
    <input id="nm" type="text" placeholder="new notebook name" maxlength="30">
    <span class="sw" id="sw"></span>
    <button>+ add</button>
  </form>
</div>

<div class="book" id="book" hidden>
  <div class="rings"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <div class="page">
    <div class="bar">
      <span><button id="prev">‹</button><span id="label"></span><button id="next">›</button></span>
      <span><button id="new">+ new page</button><button id="close">close ✕</button></span>
    </div>
    <textarea id="t" placeholder="Start typing…" spellcheck="false"></textarea>
  </div>

  <div class="cover" id="cover">
    <div class="face front grid-bg">
      <div class="title"><b>Mark∀Down</b><div class="box">
        <input class="f" data-k="name" placeholder="Untitled — name" maxlength="40">
        <input class="f" data-k="d2" placeholder="subject" maxlength="40">
        <input class="f" data-k="d3" placeholder="date / notes" maxlength="40">
      </div><small>JUST ENJOY<br>WRITING</small></div>
    </div>
    <div class="face back"></div>
  </div>
  <div class="hint">tap the book to open <button id="toShelf">← all notebooks</button></div>
</div>

<script>
  const $ = id => document.getElementById(id), t = $('t'), PAL = ['#16382f', '#1d2f4f', '#5a1e2b', '#2b2b2e', '#5b4a1f'];
  let nbs, cur, pages, i, busy = false;
  try { nbs = JSON.parse(localStorage.nbs || 'null') || [{ name: 'Journal', color: PAL[0], pages: JSON.parse(localStorage.journal || '[""]') }] }
  catch { nbs = [{ name: 'Journal', color: PAL[0], pages: [''] }] }
  const save = () => { try { localStorage.nbs = JSON.stringify(nbs) } catch {} };
  const show = () => { t.value = pages[i]; $('label').textContent = ` page ${i + 1} / ${pages.length} ` };

  // ---- shelf ----
  const renderShelf = () => {
    $('grid').replaceChildren(...nbs.map((n, k) => {
      const b = document.createElement('button'), s = document.createElement('span');
      b.className = 'mini grid-bg'; b.style.setProperty('--green', n.color);
      s.textContent = n.name || 'Untitled'; b.append(s); b.onclick = () => pick(k);
      const x = document.createElement('span');
      x.className = 'del'; x.textContent = '✕'; x.title = 'Delete notebook';
      x.onclick = e => {
        e.stopPropagation();
        if (confirm(`Delete "${n.name}" and all its pages? This can't be undone.`)) { nbs.splice(k, 1); save(); renderShelf() }
      };
      b.append(x);
      return b;
    }));
  };
  $('sw').innerHTML = PAL.map((c, k) => `<input type="radio" name="c" value="${c}" style="--c:${c}" ${k ? '' : 'checked'}>`).join('');
  $('make').onsubmit = e => {
    e.preventDefault();
    nbs.push({ name: $('nm').value.trim(), color: document.querySelector('[name=c]:checked').value, pages: [''] });
    $('nm').value = ''; save(); pick(nbs.length - 1);
  };
  const showShelf = () => { renderShelf(); $('book').hidden = true; $('shelf').hidden = false };
  const pick = k => {
    cur = k; pages = nbs[k].pages; i = pages.length - 1;
    $('book').style.setProperty('--green', nbs[k].color);
    document.querySelectorAll('.f').forEach(f => f.value = nbs[k][f.dataset.k] || '');
    $('book').classList.remove('open'); $('shelf').hidden = true; $('book').hidden = false; show();
  };
  $('toShelf').onclick = showShelf;

  // ---- book ----
  $('cover').onclick = () => { $('book').classList.add('open'); setTimeout(() => t.focus(), 1100) };
  $('close').onclick = () => { if (!busy) { t.blur(); $('book').classList.remove('open') } };
  t.oninput = () => { pages[i] = t.value; save() };
  // the 3 cover rows: name + 2 details (clicking them edits instead of opening)
  document.querySelectorAll('.f').forEach(f => {
    f.onclick = e => e.stopPropagation();
    f.onkeydown = e => { if (e.key === 'Enter') (f.nextElementSibling || f).focus() };
    f.oninput = () => { nbs[cur][f.dataset.k] = f.value.trim(); save() };
  });

  // flip to page n: forward = old page peels up over the rings, backward = it falls back down
  const flip = n => {
    if (busy || n === i || n < 0 || n >= pages.length) return;
    busy = true;
    const fwd = n > i, s = document.createElement('div');
    s.className = 'sheet';
    s.innerHTML = '<div class="face front"><div class="txt"></div></div><div class="face back"></div>';
    s.firstChild.prepend($('book').querySelector('.bar').cloneNode(true));
    s.querySelector('.txt').textContent = pages[fwd ? i : n];
    s.style.transition = 'none';
    s.style.transform = fwd ? 'rotateX(0)' : 'rotateX(180deg)';
    $('book').append(s); s.offsetHeight;
    s.style.transition = '';
    if (fwd) { i = n; show() }
    s.style.transform = fwd ? 'rotateX(180deg)' : 'rotateX(0)';
    setTimeout(() => { if (!fwd) { i = n; show() } s.remove(); busy = false; t.focus() }, 920);
  };
  $('prev').onclick = () => flip(i - 1);
  $('next').onclick = () => flip(i + 1);
  $('new').onclick  = () => { if (busy) return; pages.push(''); save(); flip(pages.length - 1) };

  // scroll / swipe: down = open → next page (→ new page at the end), up = previous page → close → shelf
  let last = 0;
  const go = d => {
    if ($('book').hidden || busy || Date.now() - last < 1000) return;
    last = Date.now();
    if (!$('book').classList.contains('open')) return d > 0 ? $('cover').onclick() : showShelf();
    if (d > 0) i < pages.length - 1 ? flip(i + 1) : pages[i] && $('new').onclick();
    else i ? flip(i - 1) : $('close').onclick();
  };
  addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) < 20) return;
    const d = Math.sign(e.deltaY);
    if (e.target === t && (d > 0 ? t.scrollTop + t.clientHeight < t.scrollHeight - 1 : t.scrollTop > 0)) return; // let long text scroll
    go(d);
  }, { passive: true });
  let y0;
  addEventListener('touchstart', e => y0 = e.target.closest('textarea,input') ? null : e.touches[0].clientY, { passive: true });
  addEventListener('touchend', e => {
    if (y0 == null) return;
    const dy = y0 - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 50) go(Math.sign(dy));
  });

  showShelf();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
