<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'Courier New',Courier,monospace">
  <defs>
    <pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#16382f"/><path d="M10 0H0V10" fill="none" stroke="#0004" stroke-width="1"/>
    </pattern>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="400" fill="#2a2623"/>

  <!-- open page peeking behind -->
  <rect x="215" y="62" width="250" height="300" rx="6" fill="#e9d8a6" filter="url(#s)" transform="rotate(5 340 212)"/>
  <g stroke="#9a875a" stroke-opacity=".5" transform="rotate(5 340 212)">
    <path d="M232 120h216M232 152h216M232 184h216M232 216h216M232 248h216M232 280h216M232 312h216"/>
  </g>
  <text x="236" y="112" font-size="15" fill="#1d1b18" transform="rotate(5 340 212)">dear diary, today I…</text>

  <!-- cover -->
  <rect x="160" y="50" width="250" height="300" rx="6" fill="url(#g)" filter="url(#s)"/>
  <g fill="none" stroke="#c9a24b" stroke-width="5">
    <rect x="178" y="32" width="12" height="34" rx="6"/><rect x="214" y="32" width="12" height="34" rx="6"/>
    <rect x="250" y="32" width="12" height="34" rx="6"/><rect x="286" y="32" width="12" height="34" rx="6"/>
    <rect x="322" y="32" width="12" height="34" rx="6"/><rect x="358" y="32" width="12" height="34" rx="6"/>
  </g>
  <g fill="#c9a24b" font-size="17">
    <text x="262" y="214">Mark∀Down</text>
    <text x="270" y="316" font-size="9" letter-spacing="3">JUST ENJOY</text>
    <text x="270" y="330" font-size="9" letter-spacing="3">WRITING</text>
  </g>
  <rect x="262" y="226" width="124" height="66" fill="none" stroke="#c9a24b"/>
  <path d="M262 248h124M262 270h124" stroke="#c9a24b"/>
  <text x="268" y="242" font-size="12" fill="#c9a24b">my journal</text>

  <!-- title -->
  <text x="560" y="170" font-size="54" fill="#e9d8a6">Just Enjoy Writing</text>
  <text x="562" y="214" font-size="20" fill="#a39a8a">a typewriter journal in a spiral notebook</text>
  <g font-size="16" fill="#c9a24b">
    <text x="562" y="270">▸ flip the cover   ▸ turn the pages   ▸ keep many notebooks</text>
  </g>
  <rect x="562" y="292" width="2" height="24" fill="#b3261e"/>
</svg>
